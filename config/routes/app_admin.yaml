app_admin_city:
    resource: |
        alias: app.city
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show']
        redirect: index
        grid: app_admin_city
        form:
            type: App\Form\Type\CityType
    type: sylius.resource
    prefix: /admin

