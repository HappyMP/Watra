sylius_twig_hooks:
    hooks:
        'sylius_shop.order.thank_you.content':
            header:
                enabled: false
            payment_instruction:
                enabled: false
            booking_banner:
                template: 'shop/order/thank_you/booking_banner.html.twig'
                priority: 200
            booking_details:
                template: 'shop/order/thank_you/booking_details.html.twig'
                priority: 150

        'sylius_shop.product.show.content.info.summary':
            header:
                enabled: false
            prices:
                enabled: false
            catalog_promotions:
                enabled: false
            short_description:
                enabled: false
            add_to_cart:
                enabled: false
            interest_button:
                template: 'shop/product/show/interest_button.html.twig'
                priority: 50
            watra_terms:
                template: 'shop/product/show/watra_terms.html.twig'
                priority: 200

        'sylius_shop.product.show.content.info.overview':
            accordion:
                enabled: false
            watra_description:
                template: 'shop/product/show/watra_description.html.twig'
                priority: 100

        'sylius_shop.product.show.content.info.summary.average_rating':
            add_review:
                enabled: false

        'sylius_shop.product.show.content.info.overview.accordion.reviews.content':
            add_review:
                enabled: false

        'sylius_shop.product.show.content':
            header:
                enabled: false
            watra_hero:
                template: 'shop/product/show/watra_hero.html.twig'
                priority: 300

        'sylius_shop.product.show.content.product_listing':
            associations:
                enabled: false

        'sylius_shop.base.offcanvas.cart.body.items':
            item:
                enabled: false

        'sylius_shop.homepage.index':
            banner:
                enabled: false
            latest_deals:
                enabled: false
            new_collection:
                enabled: false
            latest_products:
                enabled: false
            watra_hero:
                template: 'shop/homepage/hero.html.twig'
                priority: 300
            watra_spotlight:
                component: 'HomepageSpotlight'
                priority: 200
            watra_city:
                component: 'HomepageCity'
                priority: 100

        'sylius_admin.dashboard.index.content':
            statistics:
                enabled: false
            latest_statistics:
                enabled: false
            watra_metrics:
                component: 'WatraDashboardMetrics'
                priority: 50

        'sylius_admin.product.show.content.header.title_block.actions':
            watra_attendees:
                template: 'admin/product/show/attendees_link.html.twig'
                priority: 50

        'sylius_shop.product.index.content':
            breadcrumbs:
                enabled: false
            body:
                enabled: false
            watra_event_list:
                template: 'shop/event_list/main.html.twig'
                priority: 0

        'sylius_shop.account.order.index.content.main':
            grid:
                enabled: false
            watra_orders:
                template: 'shop/account/orders/main.html.twig'
                priority: 0

        'sylius_shop.account.interests.index.content':
            menu:
                template: '@SyliusShop/account/common/content/menu.html.twig'
                priority: 100
            main:
                template: 'shop/account/interests/main.html.twig'
                priority: 0
