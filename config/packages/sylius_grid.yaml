sylius_grid:
    grids:
        app_admin_city:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\Catalog\City
            fields:
                id:
                    type: string
                    label: sylius.ui.id
                name:
                    type: twig
                    label: sylius.ui.name
                    options:
                        template: '@SyliusUi/Grid/Field/translatableEntity.html.twig'
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

        app_admin_venue:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\Catalog\Venue
            fields:
                id:
                    type: string
                    label: sylius.ui.id
                name:
                    type: twig
                    label: sylius.ui.name
                    options:
                        template: '@SyliusUi/Grid/Field/translatableEntity.html.twig'
                city:
                    type: string
                    label: app.ui.city
                    path: city.name
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

        app_admin_administration_role:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\Admin\AdministrationRole
            fields:
                id:
                    type: string
                    label: sylius.ui.id
                name:
                    type: string
                    label: sylius.ui.name
                isSuperAdmin:
                    type: twig
                    label: app.ui.super_admin
                    options:
                        template: '@SyliusUi/Grid/Field/yesNo.html.twig'
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
